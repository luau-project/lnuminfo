name: CI

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
    paths-ignore:
      - "*.md"
  pull_request:
    paths-ignore:
      - "*.md"

permissions:
  contents: read

env:
  # datafile
  DATAFILE_VERSION: 0.11
  DATAFILE_ROCKSPEC_REV: 1

  # luacov
  LUACOV_VERSION: 0.17.0
  LUACOV_ROCKSPEC_REV: 1

  # cluacov
  CLUACOV_VERSION: 1.0.0
  CLUACOV_ROCKSPEC_REV: 1

jobs:
  test-minimal:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm

        lua-version:
          - 5.1
          - 5.2
          - 5.3
          - 5.4
          - 5.5
          - luajit
          - openresty

        toolchain:
          - msvc
          - cc

        exclude:

          - os: ubuntu-latest
            toolchain: msvc

          - os: macos-latest
            toolchain: msvc

          - os: windows-11-arm
            toolchain: cc

          - os: ubuntu-24.04-arm
            toolchain: msvc
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC developer prompt
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        with:
          arch: ${{ runner.arch }}

      - name: Install Lua
        uses: luau-project/setup-lua@21cfaee9b36a5aede562293e9cb467397a79c7f5 # v3.1.0
        with:
          lua-version: ${{ matrix.lua-version }}

      - name: Print Lua version
        run: lua -v

      - name: Print LuaRocks version
        run: luarocks --version

      - name: Download datafile (Unix)
        if: runner.os != 'Windows'
        run: curl -L --create-dirs -o "deps/datafile-${DATAFILE_VERSION}.tar.gz" "https://github.com/hishamhm/datafile/archive/refs/tags/v${DATAFILE_VERSION}.tar.gz"

      - name: Download datafile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: curl -L --create-dirs -o "deps\datafile-%DATAFILE_VERSION%.tar.gz" "https://github.com/hishamhm/datafile/archive/refs/tags/v%DATAFILE_VERSION%.tar.gz"

      - name: Extract datafile (Unix)
        if: runner.os != 'Windows'
        run: tar -xf "deps/datafile-${DATAFILE_VERSION}.tar.gz"

      - name: Extract datafile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tar -xf "deps\datafile-%DATAFILE_VERSION%.tar.gz"

      - name: Install datafile (Unix)
        if: runner.os != 'Windows'
        run: luarocks make "rockspecs/datafile-${DATAFILE_VERSION}-${DATAFILE_ROCKSPEC_REV}.rockspec"

      - name: Install datafile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: luarocks make "rockspecs\datafile-%DATAFILE_VERSION%-%DATAFILE_ROCKSPEC_REV%.rockspec"

      - name: Download luacov (Unix)
        if: runner.os != 'Windows'
        run: curl -L --create-dirs -o "deps/luacov-${LUACOV_VERSION}.tar.gz" "https://github.com/lunarmodules/cluacov/archive/refs/tags/v${LUACOV_VERSION}.tar.gz"

      - name: Download luacov (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: curl -L --create-dirs -o "deps\luacov-%LUACOV_VERSION%.tar.gz" "https://github.com/lunarmodules/cluacov/archive/refs/tags/v%LUACOV_VERSION%.tar.gz"

      - name: Extract luacov (Unix)
        if: runner.os != 'Windows'
        run: tar -xf "deps/luacov-${LUACOV_VERSION}.tar.gz"

      - name: Extract luacov (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tar -xf "deps\luacov-%LUACOV_VERSION%.tar.gz"

      - name: Install luacov (Unix)
        if: runner.os != 'Windows'
        run: luarocks make "rockspecs/luacov-${LUACOV_VERSION}-${LUACOV_ROCKSPEC_REV}.rockspec"

      - name: Install luacov (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: luarocks make "rockspecs\luacov-%LUACOV_VERSION%-%LUACOV_ROCKSPEC_REV%.rockspec"

      - name: Download cluacov (Unix)
        if: runner.os != 'Windows'
        run: curl -L --create-dirs -o "deps/cluacov-${CLUACOV_VERSION}.tar.gz" "https://github.com/lunarmodules/cluacov/archive/refs/tags/${CLUACOV_VERSION}.tar.gz"

      - name: Download cluacov (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: curl -L --create-dirs -o "deps\cluacov-%CLUACOV_VERSION%.tar.gz" "https://github.com/lunarmodules/cluacov/archive/refs/tags/%CLUACOV_VERSION%.tar.gz"

      - name: Extract cluacov (Unix)
        if: runner.os != 'Windows'
        run: tar -xf "deps/cluacov-${CLUACOV_VERSION}.tar.gz"

      - name: Extract cluacov (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tar -xf "deps\cluacov-%CLUACOV_VERSION%.tar.gz"

      - name: Install cluacov (Unix)
        if: runner.os != 'Windows'
        run: luarocks make "rockspecs/cluacov-${CLUACOV_VERSION}-${CLUACOV_ROCKSPEC_REV}.rockspec"

      - name: Install cluacov (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: luarocks make "rockspecs\cluacov-%CLUACOV_VERSION%-%CLUACOV_ROCKSPEC_REV%.rockspec"

      - name: Lint rockspecs, Build C module for the tests, Test with Coverage and Generate Coverage Report (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          IF "%TOOLCHAIN%" EQU "msvc" (
            SET "CURRENT_MAKE=nmake"
            SET "CURRENT_MAKE_FILE_FLAG=/F"
            SET "CURRENT_CCONLY=/c"
            SET "CURRENT_CCOUT=/Fo"
            SET "CURRENT_CCINCLUDEFLAG=/I"
            SET "CURRENT_LDOUT=/OUT:"
          ) ELSE IF "%TOOLCHAIN%" EQU "cc" (
            SET "CURRENT_MAKE=mingw32-make"
            SET "CURRENT_MAKE_FILE_FLAG=-f"
            SET "CURRENT_CCONLY=-c"
            SET "CURRENT_CCOUT=-o "
            SET "CURRENT_CCINCLUDEFLAG=-I"
            SET "CURRENT_LDOUT=-o "
          ) ELSE (
            ECHO Unexpected toolchain: %TOOLCHAIN%
            EXIT /B 1
          )

          FOR /F "TOKENS=* USEBACKQ" %%D IN (`luarocks config variables.LUA_DIR`) ^
          DO FOR /F "TOKENS=* USEBACKQ" %%C IN (`luarocks config variables.CC`) ^
          DO FOR /F "TOKENS=* USEBACKQ" %%F IN (`luarocks config variables.CFLAGS`) ^
          DO FOR /F "TOKENS=* USEBACKQ" %%L IN (`luarocks config variables.LD`) ^
          DO FOR /F "TOKENS=* USEBACKQ" %%S IN (`luarocks config variables.LIBFLAG`) ^
          DO FOR /F "TOKENS=* USEBACKQ" %%I IN (`luarocks config variables.LUA_INCDIR`) ^
          DO FOR /F "TOKENS=* USEBACKQ" %%A IN (`luarocks config variables.LUA_LIBDIR`) ^
          DO FOR /F "TOKENS=* USEBACKQ" %%B IN (`luarocks config variables.LUALIB`) ^
          DO (
            %CURRENT_MAKE% ^
              %CURRENT_MAKE_FILE_FLAG% Makefile.win ^
              "PREFIX=%%D" ^
              "CC=%%C" ^
              "CFLAGS=%%F" ^
              "CCONLY=%CURRENT_CCONLY%" ^
              "CCOUT=%CURRENT_CCOUT%" ^
              "CCINCLUDEFLAG=%CURRENT_CCINCLUDEFLAG%" ^
              "LD=%%L" ^
              "LDSHARED=%%S" ^
              "LDOUT=%CURRENT_LDOUT%" ^
              "LUA_INCDIR=%%I" ^
              "LUA_LIB=%%A\%%B" ^
              clean lint-rockspecs c-test-with-cov coverage
          )

      - name: Lint rockspecs, Build C module for the tests, Test with Coverage and Generate Coverage Report (Unix)
        if: runner.os != 'Windows'
        run: |
          make \
            -f Makefile.unix \
            "PREFIX=$(luarocks config variables.LUA_DIR)" \
            "CC=$(luarocks config variables.CC)" \
            "CFLAGS=$(luarocks config variables.CFLAGS)" \
            "LD=$(luarocks config variables.LD)" \
            "LDSHARED=$(luarocks config variables.LIBFLAG)" \
            "LUA_INCDIR=$(luarocks config variables.LUA_INCDIR)" \
            clean lint-rockspecs c-test-with-cov coverage

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-custom-float-type:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm

        lua-version:
          - 5.3
          - 5.4
          - 5.5

        toolchain:
          - msvc
          - cc

        c-float-type:
          - float
          - long-double

        exclude:

          - os: ubuntu-latest
            toolchain: msvc

          - os: macos-latest
            toolchain: msvc

          - os: ubuntu-24.04-arm
            toolchain: msvc

          - os: windows-latest
            toolchain: cc
            c-float-type: long-double

          - os: windows-11-arm
            toolchain: cc
            c-float-type: long-double

    env:
      TOOLCHAIN: ${{ matrix.toolchain }}

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC developer prompt
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        with:
          arch: ${{ runner.arch }}

      - name: Install Lua
        uses: luau-project/setup-lua@21cfaee9b36a5aede562293e9cb467397a79c7f5 # v3.1.0
        with:
          lua-version: ${{ matrix.lua-version }}
          lua-patches: ${{ github.workspace }}/.github/workflows/lua-${{ matrix.lua-version }}-luaconf-${{ matrix.c-float-type }}.patch

